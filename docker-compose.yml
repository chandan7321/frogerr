services:
  coordinator:
    build: .
    environment:
      MODE: coordinator
      LISTEN_ADDR: :8080
      DATABASE_PATH: /data/forger.db
      NODE_URLS: n1=http://node1:8081,n2=http://node2:8081,n3=http://node3:8081,n4=http://node4:8081
      DEFAULT_RF: 3
      DEFAULT_MIN_SUCCESS: 2
    ports: ["8080:8080"]
    volumes: ["coordinator-data:/data"]
    depends_on: [node1, node2, node3, node4]
  node1: &node
    build: .
    environment: { MODE: node, NODE_ID: n1, LISTEN_ADDR: ":8081", DATA_DIR: /data, CAPACITY_BYTES: 1073741824 }
    volumes: ["node1-data:/data"]
  node2:
    <<: *node
    environment: { MODE: node, NODE_ID: n2, LISTEN_ADDR: ":8081", DATA_DIR: /data, CAPACITY_BYTES: 1073741824 }
    volumes: ["node2-data:/data"]
  node3:
    <<: *node
    environment: { MODE: node, NODE_ID: n3, LISTEN_ADDR: ":8081", DATA_DIR: /data, CAPACITY_BYTES: 1073741824 }
    volumes: ["node3-data:/data"]
  node4:
    <<: *node
    environment: { MODE: node, NODE_ID: n4, LISTEN_ADDR: ":8081", DATA_DIR: /data, CAPACITY_BYTES: 1073741824 }
    volumes: ["node4-data:/data"]
volumes:
  coordinator-data:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
